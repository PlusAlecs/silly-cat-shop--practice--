<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Silly cat store</title>

        <link rel="stylesheet" href="styles.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    
        <script src="/js/script.js" defer></script>
    </head>
    
    <body>
        <header class="header">

            <div class = "logo">
                <img class="logo" src="assets/bag.png" />
            </div>

            <div class="title"><h2>Super silly cat store</h2></div>

            <div class="navbar">
                <nav><a href="#">Silly cats</a></nav>
                <nav><a href="#">Serious cats</a></nav>
                <nav><a href="#">More silly cats</a></nav>
            </div>
        </header>

        <main class="main-content">
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/bleh.jpg"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Blehhhhh</h1>
                        <div class="cat-pill-price">10 doblones</div>
                    </div>
                </div>
            </div>
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/jinx.png"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Jinx</h1>
                        <div class="cat-pill-price">15 doblones</div>
                    </div>
                </div>
            </div>
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/uva.png"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Uva</h1>
                        <div class="cat-pill-price">12 doblones</div>
                    </div>
                </div>
            </div>
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/cutie.png"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Cutie</h1>
                        <div class="cat-pill-price">999 doblones</div>
                    </div>
                </div>
            </div>
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/freaky.png"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Freaky</h1>
                        <div class="cat-pill-price">16 doblones</div>
                    </div>
                </div>
            </div>
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/insane.png"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Insane</h1>
                        <div class="cat-pill-price">18 doblones</div>
                    </div>
                </div>
            </div>
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/stupid.png"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Stupid</h1>
                        <div class="cat-pill-price">27 doblones</div>
                    </div>
                </div>
            </div>
            <div class="cat-pill-container">
                <div class="cat-pill">
                    <div class="cat-pill-header">
                        <img alt="cat-image" src="assets/flabber.png"/>
                    </div>
                    <div class="cat-pill-body">
                        <h1 class="cat-pill-title">Flabber</h1>
                        <div class="cat-pill-price">1 doblón</div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class = "title"><h3>Por Alex</h3></div>
        </footer>

    </body>
</html>
